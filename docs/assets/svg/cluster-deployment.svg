<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 1050"
     width="1600"
     height="1050"
     role="img"
     aria-labelledby="title description">
  <title id="title">文件上传服务集群部署</title>
  <desc id="description">
    展示负载均衡、多个无状态FastAPI节点、Worker集群、高可用数据库、Redis和对象存储。
  </desc>

  <defs>
    <style>
      .title { font: 700 30px sans-serif; fill: #172554; }
      .layer { font: 700 19px sans-serif; fill: #1e3a8a; }
      .heading { font: 700 16px sans-serif; fill: #fff; }
      .line {
        stroke: #64748b;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrow);
      }
      .direct {
        stroke: #db2777;
        stroke-width: 2.5;
        stroke-dasharray: 9 6;
        fill: none;
        marker-end: url(#pinkArrow);
      }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#64748b"/>
    </marker>

    <marker id="pinkArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#db2777"/>
    </marker>

    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="1050" rx="24" fill="#f8fafc"/>

  <text x="800" y="48" text-anchor="middle" class="title">
    多节点集群部署架构
  </text>

  <text x="35" y="125" class="layer">客户端</text>

  <rect x="160" y="80" width="340" height="95" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="330" y="119" text-anchor="middle" class="heading">
    Python SDK / Business Client
  </text>
  <text x="330" y="147" text-anchor="middle" class="heading">
    Files · Directories · Resume
  </text>

  <rect x="630" y="80" width="340" height="95" rx="14"
        fill="#7c3aed" filter="url(#shadow)"/>
  <text x="800" y="119" text-anchor="middle" class="heading">
    Upload Portal
  </text>
  <text x="800" y="147" text-anchor="middle" class="heading">
    HTTPS / Presigned Upload
  </text>

  <rect x="1100" y="80" width="340" height="95" rx="14"
        fill="#0891b2" filter="url(#shadow)"/>
  <text x="1270" y="119" text-anchor="middle" class="heading">
    Web / Mobile Client
  </text>
  <text x="1270" y="147" text-anchor="middle" class="heading">
    Direct Multipart Upload
  </text>

  <text x="35" y="265" class="layer">负载均衡</text>

  <rect x="275" y="220" width="1050" height="90" rx="14"
        fill="#0f172a" filter="url(#shadow)"/>
  <text x="800" y="258" text-anchor="middle" class="heading">
    WAF / External Load Balancer / Nginx / Ingress
  </text>
  <text x="800" y="286" text-anchor="middle" class="heading">
    No Sticky Session · Health Check · TLS · Rate Limit
  </text>

  <text x="35" y="440" class="layer">API集群</text>

  <rect x="100" y="370" width="300" height="120" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="250" y="410" text-anchor="middle" class="heading">
    FastAPI Node 1
  </text>
  <text x="250" y="439" text-anchor="middle" class="heading">
    Stateless
  </text>
  <text x="250" y="466" text-anchor="middle" class="heading">
    Ready / Live
  </text>

  <rect x="475" y="370" width="300" height="120" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="625" y="410" text-anchor="middle" class="heading">
    FastAPI Node 2
  </text>
  <text x="625" y="439" text-anchor="middle" class="heading">
    Stateless
  </text>
  <text x="625" y="466" text-anchor="middle" class="heading">
    Ready / Live
  </text>

  <rect x="850" y="370" width="300" height="120" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="1000" y="410" text-anchor="middle" class="heading">
    FastAPI Node 3
  </text>
  <text x="1000" y="439" text-anchor="middle" class="heading">
    Stateless
  </text>
  <text x="1000" y="466" text-anchor="middle" class="heading">
    Ready / Live
  </text>

  <rect x="1225" y="370" width="275" height="120" rx="14"
        fill="#ea580c" filter="url(#shadow)"/>
  <text x="1362" y="410" text-anchor="middle" class="heading">
    Worker Cluster
  </text>
  <text x="1362" y="439" text-anchor="middle" class="heading">
    2+ Replicas
  </text>
  <text x="1362" y="466" text-anchor="middle" class="heading">
    SKIP LOCKED
  </text>

  <text x="35" y="635" class="layer">共享状态</text>

  <rect x="150" y="565" width="550" height="130" rx="14"
        fill="#0f766e" filter="url(#shadow)"/>
  <text x="425" y="607" text-anchor="middle" class="heading">
    PostgreSQL HA
  </text>
  <text x="425" y="637" text-anchor="middle" class="heading">
    Primary / Replica / Automated Failover
  </text>
  <text x="425" y="667" text-anchor="middle" class="heading">
    Durable Upload &amp; Lifecycle State
  </text>

  <rect x="900" y="565" width="550" height="130" rx="14"
        fill="#dc2626" filter="url(#shadow)"/>
  <text x="1175" y="607" text-anchor="middle" class="heading">
    Redis HA
  </text>
  <text x="1175" y="637" text-anchor="middle" class="heading">
    Cache · Rate Limit · Progress
  </text>
  <text x="1175" y="667" text-anchor="middle" class="heading">
    Not Source of Truth
  </text>

  <text x="35" y="830" class="layer">对象存储</text>

  <rect x="160" y="760" width="560" height="135" rx="14"
        fill="#db2777" filter="url(#shadow)"/>
  <text x="440" y="803" text-anchor="middle" class="heading">
    Distributed MinIO Cluster
  </text>
  <text x="440" y="833" text-anchor="middle" class="heading">
    Multi-node · Multi-disk · Erasure Coding
  </text>
  <text x="440" y="863" text-anchor="middle" class="heading">
    Private Deployment
  </text>

  <rect x="880" y="760" width="560" height="135" rx="14"
        fill="#0891b2" filter="url(#shadow)"/>
  <text x="1160" y="803" text-anchor="middle" class="heading">
    Cloud S3 Compatible Storage
  </text>
  <text x="1160" y="833" text-anchor="middle" class="heading">
    Versioning · Lifecycle · Replication
  </text>
  <text x="1160" y="863" text-anchor="middle" class="heading">
    Production Preferred
  </text>

  <rect x="160" y="955" width="1280" height="55" rx="12" fill="#334155"/>
  <text x="800" y="990" text-anchor="middle" class="heading">
    Prometheus · Grafana · OpenTelemetry · Centralized Logs · Alerting
  </text>

  <path d="M330 175 L560 220" class="line"/>
  <path d="M800 175 L800 220" class="line"/>
  <path d="M1270 175 L1040 220" class="line"/>

  <path d="M470 310 L250 370" class="line"/>
  <path d="M680 310 L625 370" class="line"/>
  <path d="M920 310 L1000 370" class="line"/>
  <path d="M1130 310 L1362 370" class="line"/>

  <path d="M250 490 L425 565" class="line"/>
  <path d="M625 490 L425 565" class="line"/>
  <path d="M1000 490 L1175 565" class="line"/>
  <path d="M1362 490 L1175 565" class="line"/>

  <path d="M425 695 L440 760" class="line"/>
  <path d="M650 695 L1160 760" class="line"/>
  <path d="M1175 695 L1160 760" class="line"/>

  <path d="M800 175 Q730 600 440 760" class="direct"/>
  <path d="M1270 175 Q1380 580 1160 760" class="direct"/>
</svg>