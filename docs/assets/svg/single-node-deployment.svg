<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1500 920"
     width="1500"
     height="920"
     role="img"
     aria-labelledby="title description">
  <title id="title">文件上传服务单节点部署</title>
  <desc id="description">
    单台服务器内部署Gateway、Portal、FastAPI、Worker、PostgreSQL、Redis和MinIO。
  </desc>

  <defs>
    <style>
      .title { font: 700 30px sans-serif; fill: #172554; }
      .zone { font: 700 20px sans-serif; fill: #1e3a8a; }
      .heading { font: 700 16px sans-serif; fill: #fff; }
      .text { font: 14px sans-serif; fill: #334155; }
      .line {
        stroke: #64748b;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrow);
      }
      .direct {
        stroke: #db2777;
        stroke-width: 2.4;
        stroke-dasharray: 8 6;
        fill: none;
        marker-end: url(#pinkArrow);
      }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#64748b"/>
    </marker>

    <marker id="pinkArrow" markerWidth="12" markerHeight="12"
            refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#db2777"/>
    </marker>

    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1500" height="920" rx="24" fill="#f8fafc"/>

  <text x="750" y="48" text-anchor="middle" class="title">
    单节点部署架构
  </text>

  <rect x="55" y="80" width="1390" height="770" rx="22"
        fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>

  <text x="85" y="120" class="zone">
    Single Host / Virtual Machine
  </text>

  <rect x="120" y="155" width="350" height="95" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="295" y="193" text-anchor="middle" class="heading">
    Python SDK / Portal User
  </text>
  <text x="295" y="222" text-anchor="middle" class="heading">
    HTTPS Upload
  </text>

  <rect x="570" y="155" width="360" height="95" rx="14"
        fill="#0f172a" filter="url(#shadow)"/>
  <text x="750" y="193" text-anchor="middle" class="heading">
    Nginx Gateway
  </text>
  <text x="750" y="222" text-anchor="middle" class="heading">
    TLS · Routing · CORS
  </text>

  <rect x="1030" y="155" width="350" height="95" rx="14"
        fill="#7c3aed" filter="url(#shadow)"/>
  <text x="1205" y="193" text-anchor="middle" class="heading">
    Portal Static App
  </text>
  <text x="1205" y="222" text-anchor="middle" class="heading">
    React / Vue
  </text>

  <rect x="180" y="330" width="430" height="125" rx="14"
        fill="#2563eb" filter="url(#shadow)"/>
  <text x="395" y="370" text-anchor="middle" class="heading">
    FastAPI API
  </text>
  <text x="395" y="399" text-anchor="middle" class="heading">
    Files · Uploads · Directories
  </text>
  <text x="395" y="428" text-anchor="middle" class="heading">
    Presign · Lifecycle
  </text>

  <rect x="890" y="330" width="430" height="125" rx="14"
        fill="#ea580c" filter="url(#shadow)"/>
  <text x="1105" y="370" text-anchor="middle" class="heading">
    Background Worker
  </text>
  <text x="1105" y="399" text-anchor="middle" class="heading">
    Cleanup · Lifecycle
  </text>
  <text x="1105" y="428" text-anchor="middle" class="heading">
    Reconcile · Webhook
  </text>

  <rect x="100" y="550" width="350" height="120" rx="14"
        fill="#0f766e" filter="url(#shadow)"/>
  <text x="275" y="590" text-anchor="middle" class="heading">
    PostgreSQL
  </text>
  <text x="275" y="619" text-anchor="middle" class="heading">
    Metadata &amp; Durable State
  </text>
  <text x="275" y="646" text-anchor="middle" class="heading">
    Volume: postgres-data
  </text>

  <rect x="575" y="550" width="350" height="120" rx="14"
        fill="#dc2626" filter="url(#shadow)"/>
  <text x="750" y="590" text-anchor="middle" class="heading">
    Redis
  </text>
  <text x="750" y="619" text-anchor="middle" class="heading">
    Cache &amp; Temporary Lease
  </text>
  <text x="750" y="646" text-anchor="middle" class="heading">
    Volume: redis-data
  </text>

  <rect x="1050" y="550" width="350" height="120" rx="14"
        fill="#db2777" filter="url(#shadow)"/>
  <text x="1225" y="590" text-anchor="middle" class="heading">
    MinIO
  </text>
  <text x="1225" y="619" text-anchor="middle" class="heading">
    S3 Multipart Storage
  </text>
  <text x="1225" y="646" text-anchor="middle" class="heading">
    Volume: minio-data
  </text>

  <rect x="260" y="740" width="980" height="70" rx="14" fill="#334155"/>
  <text x="750" y="783" text-anchor="middle" class="heading">
    Host Persistent Volumes · Backup Directory · TLS Certificates
  </text>

  <path d="M470 202 L570 202" class="line"/>
  <path d="M930 202 L1030 202" class="line"/>
  <path d="M680 250 L450 330" class="line"/>
  <path d="M820 250 L1050 330" class="line"/>

  <path d="M395 455 L275 550" class="line"/>
  <path d="M500 455 L750 550" class="line"/>
  <path d="M600 430 L1225 550" class="line"/>

  <path d="M1105 455 L900 550" class="line"/>
  <path d="M1105 455 L1225 550" class="line"/>
  <path d="M1205 250 Q1390 380 1225 550" class="direct"/>

  <path d="M275 670 L500 740" class="line"/>
  <path d="M750 670 L750 740" class="line"/>
  <path d="M1225 670 L1000 740" class="line"/>
</svg>