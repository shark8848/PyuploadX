name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app sdk upload_service tests scripts
      - name: Compile
        run: python -m compileall -q app sdk upload_service

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upload
          POSTGRES_PASSWORD: upload
          POSTGRES_DB: uploads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upload"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UPLOAD_DATABASE_URL: postgresql+asyncpg://upload:upload@localhost:5432/uploads
      UPLOAD_CLUSTER__ENABLED: "false"
      UPLOAD_STORAGE__BACKEND: local
      UPLOAD_REDIS__ENABLED: "false"
      UPLOAD_API_KEYS: '{"acme/alice": ["test-key-1"]}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests (PostgreSQL)
        run: python -m pytest tests/integration -q

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[docs,dev]"
      - name: Validate diagrams
        run: python scripts/render_diagrams.py --check
      - name: Validate SVG safety
        run: python scripts/check_docs.py

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        working-directory: portal
        run: npm ci || npm install
      - name: Build
        working-directory: portal
        run: npm run build
