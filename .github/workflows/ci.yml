name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app sdk upload_service tests scripts
      - name: Compile
        run: python -m compileall -q app sdk upload_service
      - name: CLI smoke
        run: |
          python -m upload_service config validate
          python -m upload_service config show --redact-secrets > /dev/null

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upload
          POSTGRES_PASSWORD: upload
          POSTGRES_DB: uploads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upload"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
    env:
      UPLOAD_DATABASE_URL: postgresql+asyncpg://upload:upload@localhost:5432/uploads
      UPLOAD_CLUSTER__ENABLED: "false"
      UPLOAD_STORAGE__BACKEND: local
      UPLOAD_REDIS__ENABLED: "false"
      UPLOAD_API_KEYS: '{"acme/alice": ["test-key-1"]}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Alembic migrations (PostgreSQL)
        run: |
          alembic upgrade head
          alembic current
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Integration tests (PostgreSQL)
        run: python -m pytest tests/integration -q
      - name: Wait for MinIO
        run: |
          python - <<'EOF'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  urllib.request.urlopen(
                      "http://localhost:9000/minio/health/live", timeout=2
                  )
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("MinIO did not become ready")
          EOF
      - name: Integration tests (PostgreSQL + MinIO)
        run: python -m pytest tests/integration/test_s3_storage.py -q
        env:
          UPLOAD_MINIO_TEST: "1"
          UPLOAD_STORAGE__S3__INTERNAL_ENDPOINT_URL: http://localhost:9000
          UPLOAD_STORAGE__S3__PUBLIC_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[docs,dev]"
      - name: Validate diagrams
        run: python scripts/render_diagrams.py --check
      - name: Validate SVG safety and Markdown refs
        run: python scripts/check_docs.py

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        working-directory: portal
        run: npm ci || npm install
      - name: Build
        working-directory: portal
        run: npm run build
