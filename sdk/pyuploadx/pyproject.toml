[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuploadx"
version = "0.8.0"
description = "PyUploadX Python client SDK - file and directory upload with multipart resume and lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyUploadX Contributors" }]
keywords = ["upload", "sdk", "multipart", "resume", "directory-upload", "lifecycle", "pyuploadx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = { pyuploadx = "." }
packages = ["pyuploadx"]
