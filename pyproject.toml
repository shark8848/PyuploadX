[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuploadx-server"
version = "0.1.5"
description = "PyUploadX file and directory upload service (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PyUploadX Contributors" }]
keywords = ["upload", "fastapi", "multipart", "resume", "directory-upload", "s3", "minio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "redis>=5.0,<6",
    "boto3>=1.34,<2",
    "aiofiles>=23.2,<25",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "prometheus-client>=0.20,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
docs = ["CairoSVG>=2.7,<3"]
log-center = ["ikc-log-center>=1.4.22,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
upload-service = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "upload_service*"]
exclude = ["app*Zone*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These enums intentionally subclass both `str` and `Enum` so SQLAlchemy
# SAEnum(native_enum=False) round-trips cleanly with str drivers.
"app/db/models.py" = ["UP042"]
