name: pyuploadx

# PostgreSQL / Redis / MinIO 等第三方组件不在此文件构建或运行：
# 通过环境变量指向本地或已有实例（默认 host.docker.internal，即宿主机地址）。
# 需要自带组件时使用 deploy/infra/compose.yaml（或 deploy/single-node|cluster/compose.yaml）。

x-app-env: &app-env
  UPLOAD_API_KEYS: '${UPLOAD_API_KEYS:-["dev-key"]}'
  UPLOAD_DATABASE_URL: '${UPLOAD_DATABASE_URL:-postgresql+asyncpg://upload:upload@host.docker.internal:5432/uploads}'
  UPLOAD_REDIS__ENABLED: '${UPLOAD_REDIS__ENABLED:-true}'
  UPLOAD_REDIS_URL: '${UPLOAD_REDIS_URL:-redis://host.docker.internal:6379/0}'
  UPLOAD_CLUSTER__ENABLED: '${UPLOAD_CLUSTER__ENABLED:-false}'
  UPLOAD_LOG_CENTER__ENABLED: '${UPLOAD_LOG_CENTER__ENABLED:-false}'
  UPLOAD_LOG_CENTER__URL: '${UPLOAD_LOG_CENTER__URL:-http://localhost:9135}'
  LOG_CENTER_TOKEN: '${LOG_CENTER_TOKEN:-}'
  UPLOAD_STORAGE__S3__INTERNAL_ENDPOINT_URL: '${UPLOAD_STORAGE__S3__INTERNAL_ENDPOINT_URL:-http://host.docker.internal:9000}'
  UPLOAD_STORAGE__S3__PUBLIC_ENDPOINT_URL: '${UPLOAD_STORAGE__S3__PUBLIC_ENDPOINT_URL:-http://localhost:9000}'
  S3_ACCESS_KEY: '${S3_ACCESS_KEY:-minioadmin}'
  S3_SECRET_KEY: '${S3_SECRET_KEY:-minioadmin}'

services:
  migrate:
    build:
      context: .
      target: api
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  upload-api:
    build:
      context: .
      target: api
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  portal:
    build:
      context: portal
      args:
        UPLOAD_API_URL: '${UPLOAD_API_URL:-http://upload-api:8000}'
    environment:
      PORTAL_API_TOKEN: '${PORTAL_API_TOKEN:-}'
    depends_on:
      - upload-api
    ports:
      - "${PORTAL_PORT:-5173}:80"
