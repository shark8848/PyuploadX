# HAProxy front for MinIO (see Dockerfile): external traffic only reaches
# HAProxy on :9000 (S3 API) and :9001 (console). MinIO itself listens on
# 127.0.0.1 inside the container and is never published.

global
    maxconn 4096
    log stdout format raw local0 notice

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout check 3s
    option http-server-close
    option dontlognull

frontend minio_s3
    bind :9000
    default_backend minio_s3_api

frontend minio_console
    bind :9001
    default_backend minio_console_web

backend minio_s3_api
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio
    server minio-api 127.0.0.1:19000 check inter 5s fall 3 rise 2

backend minio_console_web
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host minio-console
    server minio-console 127.0.0.1:19001 check inter 5s fall 3 rise 2
