apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-portal
  namespace: upload-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload-portal
  template:
    metadata:
      labels:
        app: upload-portal
    spec:
      containers:
        - name: portal
          image: pyuploadx/upload-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
