apiVersion: v1
kind: Secret
metadata:
  name: upload-secrets
  namespace: upload-service
type: Opaque
stringData:
  UPLOAD_DATABASE_URL: "postgresql+asyncpg://upload:REPLACE_ME@postgres:5432/uploads"
  UPLOAD_REDIS_URL: "redis://redis:6379/0"
  UPLOAD_API_KEYS: '{"acme/alice": ["REPLACE_WITH_API_KEY"]}'
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET"
