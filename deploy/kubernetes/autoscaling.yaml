apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upload-api
  namespace: upload-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upload-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upload-worker
  namespace: upload-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upload-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
