name: pyuploadx-infra

# 可选的自带第三方组件栈（PostgreSQL / Redis / MinIO + 存储桶初始化）。
# 端口可用 POSTGRES_PORT / REDIS_PORT / MINIO_PORT / MINIO_CONSOLE_PORT 覆盖，
# 应用侧通过 UPLOAD_DATABASE_URL / UPLOAD_REDIS_URL / UPLOAD_STORAGE__S3__* 指向它们。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: upload
      POSTGRES_PASSWORD: upload
      POSTGRES_DB: uploads
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upload"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/app-default &&
      mc mb --ignore-existing local/public-assets &&
      mc anonymous set download local/public-assets
      "

volumes:
  postgres-data:
  minio-data:
